name: CI/CD

# ============================================================
# 发布约定（v2.38.4 起）
#
# 1) push 到 main / pull_request / 手动触发：**只做验证**
#    （lint / 类型检查 / 测试 / 构建），不登录镜像仓库、不推送镜像、不创建 Release。
# 2) 只有推送 **vX.Y.Z 形式的正式版本 tag** 才执行正式发布：
#    构建并推送「版本号 + latest」镜像，并创建对应的 GitHub Release。
#
# 背景：此前 push → main 会自动重建并推送正式版本镜像，
#   导致普通合并提交覆盖同版本号镜像（v2.38.3 被合并提交 2ca2867 覆盖，
#   而 git tag v2.38.3 仍指向 5571fed6）。版本号必须代表内容，
#   因此把「发布」收敛为唯一的 tag 触发路径。
#
# 正式发布流程：
#   1. 改 package.json / package-lock.json 的版本号并合并到 main
#   2. git tag -a vX.Y.Z -m "Release vX.Y.Z" && git push origin vX.Y.Z
#   3. 本工作流校验通过后推送镜像 + 创建 Release
# ============================================================

# 默认最小权限：只读。需要写权限的 job 在自己的 job 内单独声明。
permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    # 手动触发只做验证，不提供任何发布参数：
    # 发布只认版本 tag，避免「点一下运行」就覆盖正式镜像。

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run build

      - name: Run tests
        run: npm test

  # ================================================================
  # 正式镜像发布（仅版本 tag 触发）
  #
  # 前置条件（全部不满足即拒绝，宁可不发也不覆盖）：
  #   1. ref 是 tag 且形如 vX.Y.Z
  #   2. tag 版本 == package.json version
  #   3. tag 所在提交在 main 上
  #   4. tag 版本严格高于所有已发布 tag
  #   5. 同版本镜像若已存在，其 OCI revision 必须等于本次提交（否则拒绝覆盖）
  # ================================================================
  image:
    name: Build & push image (version tag only)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') && needs.test.result == 'success'
    runs-on: ubuntu-latest
    # 串行化正式发布：多个版本 tag 同时推送时，不并行争抢 :latest 与版本标签。
    # cancel-in-progress: false —— 已经开始的一次发布不会被取消，后来的运行排队等待。
    concurrency:
      group: publish-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_BASE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整 tag 历史做「严格递增」校验
          fetch-depth: 0

      # 发布前置校验：tag 格式 / 版本一致 / 在 main 上 / 严格递增
      - name: Validate release preconditions
        id: validate
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "触发 tag: ${TAG_NAME}"

          # 1) 只接受 vX.Y.Z 形式（防止分支名或临时 tag 触发发布）
          if ! printf '%s' "${TAG_NAME}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: 发布 tag 必须是 vX.Y.Z 形式（当前：${TAG_NAME}）" >&2
            exit 1
          fi
          VER="${TAG_NAME#v}"

          # 2) tag 版本必须等于 package.json 版本（版本号单一来源）
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "${VER}" != "${PKG_VER}" ]; then
            echo "ERROR: tag 版本 ${VER} 与 package.json ${PKG_VER} 不一致，拒绝发布" >&2
            exit 1
          fi

          # 3) tag 所在提交必须已在 main 上
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "ERROR: tag 所在提交不在 main 上，拒绝发布" >&2
            exit 1
          fi

          # 4) 版本必须严格高于所有已发布 tag（排除自身）
          #    不依赖 sort -V（不同环境的 sort 支持不一致），用逐段整数比较
          ver_gt() { # $1 > $2 时返回 0
            local a1 a2 a3 b1 b2 b3
            IFS=. read -r a1 a2 a3 <<< "$1"
            IFS=. read -r b1 b2 b3 <<< "$2"
            if [ "$a1" -ne "$b1" ]; then [ "$a1" -gt "$b1" ]; return $?; fi
            if [ "$a2" -ne "$b2" ]; then [ "$a2" -gt "$b2" ]; return $?; fi
            if [ "$a3" -ne "$b3" ]; then [ "$a3" -gt "$b3" ]; return $?; fi
            return 1
          }
          MAX_PREV=""
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            [ "$t" = "$TAG_NAME" ] && continue
            v="${t#v}"
            if [ -z "$MAX_PREV" ] || ver_gt "$v" "$MAX_PREV"; then MAX_PREV="$v"; fi
          done < <(git tag -l 'v[0-9]*')
          if [ -n "$MAX_PREV" ] && ! ver_gt "$VER" "$MAX_PREV"; then
            echo "ERROR: $VER 必须严格高于已发布版本 $MAX_PREV，禁止复用或回退版本号" >&2
            exit 1
          fi

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "版本校验通过：$VER（上一个已发布版本：${MAX_PREV:-无}）"

      - name: Compute lowercase image name
        id: image
        run: echo "image=$(echo "${IMAGE_BASE}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # ---------- Docker Hub 凭据（没配就只发 GHCR） ----------
      - name: Check Docker Hub credentials
        id: dh
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DH_USER}" ] && [ -n "${DH_TOKEN}" ]; then
            echo "user=$(echo "${DH_USER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub 推送: 已启用"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub 推送: 未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，仅发布 GHCR"
          fi

      # ---------- 拒绝覆盖已发布版本 ----------
      - name: Check registry state (refuse to overwrite)
        id: check
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          NEW_VER: ${{ steps.validate.outputs.version }}
          DH_USER: ${{ steps.dh.outputs.user }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WANT_SHA="$(git rev-parse HEAD)"
          ACCEPT='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'

          # 读取某 registry 上该版本镜像的 OCI revision 标签（读不到返回空）
          probe_revision() {
            REG_NAME="$1"; REPO="$2"; AUTH="$3"
            MAN=$(curl -fsSL -H "Authorization: Bearer ${AUTH}" -H "Accept: ${ACCEPT}" \
              "https://${REG_NAME}/v2/${REPO}/manifests/${NEW_VER}" 2>/dev/null || true)
            [ -z "${MAN}" ] && return 0

            # 单平台 manifest：有 .config.digest 且无 .manifests[]
            CFG_DIGEST=$(printf '%s' "${MAN}" | jq -r 'if (.manifests? | type) == "array"
                          then empty else (.config.digest // empty) end' 2>/dev/null)
            if [ -n "${CFG_DIGEST}" ]; then
              curl -fsSL -H "Authorization: Bearer ${AUTH}" \
                "https://${REG_NAME}/v2/${REPO}/blobs/${CFG_DIGEST}" 2>/dev/null \
                | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' 2>/dev/null
              return 0
            fi

            # 多平台 index：取 linux/amd64 子 manifest → 其 config digest → config blob
            SUB=$(printf '%s' "${MAN}" \
              | jq -r '.manifests[]? | select(.platform.architecture=="amd64" and .platform.os=="linux") | .digest' 2>/dev/null | head -1)
            [ -z "${SUB}" ] && return 0
            SUB_CFG=$(curl -fsSL -H "Authorization: Bearer ${AUTH}" -H "Accept: ${ACCEPT}" \
              "https://${REG_NAME}/v2/${REPO}/manifests/${SUB}" 2>/dev/null \
              | jq -r '.config.digest // empty' 2>/dev/null)
            [ -z "${SUB_CFG}" ] && return 0
            curl -fsSL -H "Authorization: Bearer ${AUTH}" \
              "https://${REG_NAME}/v2/${REPO}/blobs/${SUB_CFG}" 2>/dev/null \
              | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' 2>/dev/null
          }

          # 判定该版本在某 registry 的状态：absent / same / different(<rev>) / unknown(<原因>)
          probe_state() {
            REG_NAME="$1"; REPO="$2"; AUTH="$3"
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${AUTH}" -H "Accept: ${ACCEPT}" \
              "https://${REG_NAME}/v2/${REPO}/manifests/${NEW_VER}" 2>/dev/null || true)
            CODE="${CODE:-000}"
            case "${CODE}" in
              200) ;;
              404) printf 'absent'; return 0 ;;
              *)   printf 'unknown(http-%s)' "${CODE}"; return 0 ;;
            esac
            REV=$(probe_revision "${REG_NAME}" "${REPO}" "${AUTH}" || true)
            if [ -z "${REV}" ]; then
              printf 'unknown(no-revision)'; return 0
            fi
            if [ "${REV}" = "${WANT_SHA}" ]; then
              printf 'same'
            else
              printf 'different(%s)' "${REV}"
            fi
          }

          # ---- GHCR ----
          REPO_PATH="${IMAGE#ghcr.io/}"
          ANON=$(curl -fsSL "https://ghcr.io/token?scope=repository:${REPO_PATH}:pull" | jq -r .token || true)
          GHCR_TOKEN="${ANON:-${GHCR_FALLBACK_TOKEN}}"
          GHCR_STATE=$(probe_state "ghcr.io" "${REPO_PATH}" "${GHCR_TOKEN}" || echo unknown)

          # ---- Docker Hub ----
          DH_STATE="skip"
          if [ -n "${DH_USER}" ] && [ -n "${DH_TOKEN}" ]; then
            DH_REPO="${DH_USER}/sub-aggregation"
            DH_T=$(curl -fsSL -u "${DH_USER}:${DH_TOKEN}" \
                     "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${DH_REPO}:pull" \
                     | jq -r .token || true)
            DH_STATE=$(probe_state "registry-1.docker.io" "${DH_REPO}" "${DH_T}" || echo unknown)
          fi

          echo "GHCR ${NEW_VER} 状态: ${GHCR_STATE}"
          echo "Docker Hub ${NEW_VER} 状态: ${DH_STATE}"

          CONFLICT=0; UNKNOWN=0; MISSING=0
          for S in "${GHCR_STATE}" "${DH_STATE}"; do
            case "${S}" in
              absent)          MISSING=1 ;;
              same|skip)       : ;;
              different*)      CONFLICT=1 ;;
              *)               UNKNOWN=1 ;;
            esac
          done

          if [ "${CONFLICT}" = "1" ]; then
            echo "ERROR: 版本 ${NEW_VER} 已发布，且镜像内容与本次提交不同 —— 拒绝覆盖已发布版本。" >&2
            echo "如需重新发布同一版本号，请先确认是否真的需要覆盖（本项目禁止）。" >&2
            exit 1
          fi
          if [ "${UNKNOWN}" = "1" ]; then
            echo "ERROR: 无法确定 ${NEW_VER} 在 registry 中的状态（不可达 / 凭据异常），为避免误覆盖，本次拒绝发布。" >&2
            exit 1
          fi
          if [ "${MISSING}" = "1" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "需要构建发布：${NEW_VER}"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "版本 ${NEW_VER} 已由同一提交发布过，跳过重复构建"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.check.outputs.should_build == 'true' && steps.dh.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        if: steps.check.outputs.should_build == 'true'
        env:
          GHCR_IMAGE: ${{ steps.image.outputs.image }}
          DH_USER: ${{ steps.dh.outputs.user }}
          DH_ENABLED: ${{ steps.dh.outputs.enabled }}
          VER: ${{ steps.validate.outputs.version }}
        run: |
          # 只在正式版本发布时推送：版本号标签 + latest（latest 跟随最近一次正式发布）
          {
            echo "tags<<EOF"
            echo "${GHCR_IMAGE}:${VER}"
            echo "${GHCR_IMAGE}:latest"
            if [ "${DH_ENABLED}" = "true" ]; then
              echo "${DH_USER}/sub-aggregation:${VER}"
              echo "${DH_USER}/sub-aggregation:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.tags.outputs.tags }}
          # revision 用于「同版本禁止覆盖不同内容」的判定
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.validate.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Verify published digest
        if: steps.check.outputs.should_build == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VER: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "ERROR: 构建推送后未取得镜像 digest，发布结果未确认" >&2
            exit 1
          fi
          echo "已推送 ${VER} / latest，digest=${DIGEST}"

  # ================================================================
  # GitHub Release（仅版本 tag，且镜像发布成功）
  #
  # 只创建已存在 tag 对应的 Release，**不创建、不移动任何 tag**。
  # ================================================================
  release:
    name: Create GitHub Release (version tag only)
    needs: [test, image]
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && needs.test.result == 'success'
      && needs.image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${TAG_NAME}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: 非法发布 tag：${TAG_NAME}" >&2
            exit 1
          fi
          # tag 由人工推送并已触发本流程，这里只做 Release，绝不创建/移动 tag
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} 已存在，跳过（不覆盖已有 Release）"
            exit 0
          fi
          gh release create "${TAG_NAME}" \
            --verify-tag \
            --title "${TAG_NAME}" \
            --notes "发布 ${TAG_NAME}。变更见 [提交历史](https://github.com/${{ github.repository }}/commits/main)。"
          echo "✅ 已创建 Release ${TAG_NAME}"
