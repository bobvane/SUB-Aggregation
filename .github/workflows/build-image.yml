# ============================================================
# 镜像状态诊断（只读）
#
# 阶段 1 安全补全：**本工作流不再构建、不再推送任何镜像。**
#
# 背景：此前本文件是独立的手动镜像推送入口，其 build job 没有
#   任何 CI 门禁 —— 手动触发即可在**未经 CI 验证**的 commit 上
#   推送正式版本标签镜像，构成门禁绕过路径。
#
# 现状：镜像构建与推送已统一收敛到 ci-cd.yml 的 `image` job
#   （needs: test + if: needs.test.result == 'success' + SHA 自证），
#   那里是**唯一**拥有 packages:write 权限并执行 push 的位置。
#
# 本文件保留的价值（不推送，故无安全风险）：
#   · 查询 GHCR / Docker Hub 现有标签与 OCI revision
#   · 报告某个版本标签对应的源码 commit 是否与 main 一致
#   · 供发版前人工核对，不改变任何远端状态
#
# 如需重新构建/推送，请通过 main 分支的正常 push 触发 ci-cd.yml
# （必要时可在 ci-cd.yml 的 image job 上点 Re-run failed jobs）。
# ============================================================
name: Image status (read-only)

on:
  # workflow_dispatch 不支持 branches 过滤；分支限制由 status job 内的运行时 guard 强制。
  workflow_dispatch:

permissions:
  contents: read   # 只读；无 packages:write → 本工作流在技术上无法推送镜像

env:
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  status:
    name: Report image tags and revisions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # 仅拉取 manifest/config；不可 push
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run outside main
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "ERROR: 本诊断仅允许在 main 上运行（当前：${{ github.ref_name }}）" >&2
            exit 1
          fi

      - name: Compute lowercase image name
        id: image
        run: echo "image=$(echo "${IMAGE_BASE}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Read version from package.json
        id: version
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Report GHCR tags and current-version revision
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          NEW_VER: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          REPO_PATH="${IMAGE#ghcr.io/}"
          ANON=$(curl -fsSL "https://ghcr.io/token?scope=repository:${REPO_PATH}:pull" | jq -r .token || true)
          AUTH="${ANON:-$GH_TOKEN}"
          TAGS=$(curl -fsSL -H "Authorization: Bearer ${AUTH}" \
                   "https://ghcr.io/v2/${REPO_PATH}/tags/list" | jq -r '.tags[]?' 2>/dev/null || true)
          echo "GHCR 现有标签："
          echo "${TAGS:-（读取失败或为空）}"
          MANIFEST=$(curl -fsSL -H "Authorization: Bearer ${AUTH}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${REPO_PATH}/manifests/${NEW_VER}" 2>/dev/null || true)
          echo "manifest 返回长度：${#MANIFEST}（空 = 该版本标签不存在或无权限）"
          echo "本工作流不执行任何 push；镜像构建请走 ci-cd.yml 的 image job。"

      - name: Report Docker Hub tags (if configured)
        env:
          NEW_VER: ${{ steps.version.outputs.version }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -u
          if [ -z "${DH_USER}" ] || [ -z "${DH_TOKEN}" ]; then
            echo "未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，跳过"
            exit 0
          fi
          DH_REPO="${DH_USER}/sub-aggregation"
          DH_T=$(curl -fsSL -u "${DH_USER}:${DH_TOKEN}" \
                   "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${DH_REPO}:pull" \
                   | jq -r .token || true)
          TAGS=$(curl -fsSL -H "Authorization: Bearer ${DH_T}" \
                   "https://registry-1.docker.io/v2/${DH_REPO}/tags/list" | jq -r '.tags[]?' 2>/dev/null || true)
          echo "Docker Hub 现有标签："
          echo "${TAGS:-（读取失败或为空）}"